{% extends "base.html" %}

{% block title %}404 - Level Not Found{% endblock %}

{% block content %}
<section class="error-page-container">
  
  <!-- Arcade Game Over Vector Graphic -->
  <div class="error-icon-box">
    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="12" rx="3"></rect>
      <line x1="6" y1="12" x2="10" y2="12"></line>
      <line x1="8" y1="10" x2="8" y2="14"></line>
      <circle cx="15" cy="11" r="1"></circle>
      <circle cx="18" cy="13" r="1"></circle>
      <path d="M9 2v4"></path>
      <path d="M15 2v4"></path>
    </svg>
  </div>

  <span class="error-badge-tag">ERROR 404</span>

  <!-- Striped Retro Headline -->
  <h1 class="error-title">
    <span class="retro-line line-magenta">GAME</span>
    <span class="retro-line line-yellow">OVER</span>
  </h1>

  <h2 class="error-subtitle">Level Not Found</h2>

  <p class="error-text">
    The stage, challenge, or page you are looking for has been moved or doesn't exist.
  </p>

  <!-- Action Buttons -->
  <div class="error-buttons">
    <a href="{% url 'home' %}" class="btn-cyan-pill">
      Restart at Home
    </a>
    <a href="{% url 'resource_list' %}" class="btn-secondary">
      Browse Games
    </a>
  </div>

</section>
{% endblock %}
