{% extends "base.html" %}

{% block title %}Preferences - PlayToCode{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Display Preferences</h1>
  <p>Customize your visual theme and interface experience.</p>
</div>

<form method="POST" class="settings-form">
  {% csrf_token %}

  <div class="form-group">
    <label for="theme">Select Interface Theme</label>
    <div class="select-wrapper">
      <select name="theme" id="theme">
        <option value="dark" {% if theme == "dark" %}selected{% endif %}>
          🌙 Dark Mode (Retro Neon Arcade)
        </option>
        <option value="light" {% if theme == "light" %}selected{% endif %}>
          ☀️ Light Mode (Crisp Daytime)
        </option>
      </select>
    </div>
    <span class="form-hint">Changes apply across all pages in the app.</span>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-form-submit">
      <span>Save Preferences</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </button>
  </div>
</form>
{% endblock %}
